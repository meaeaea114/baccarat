<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baccarat Table - Authentic Cards</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
    }

    body {
      background-color: #0d0d0d;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game-container {
      width: 100%;
      max-width: 650px;
      background: #111;
      border-radius: 12px;
      overflow: hidden;
    }

    /* Table Felt */
    .table-area {
      background: radial-gradient(circle, #0e4d28 0%, #051d0f 100%);
      padding: 40px 20px;
      position: relative;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* VIP Badge */
    .vip-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 55px;
      height: 55px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d4af37;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* Table Hands Setup */
    .table-hands {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0 10px;
      z-index: 1;
    }

    .hand-side {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .hand-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .hand-title {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
      font-family: 'Times New Roman', serif;
    }

    .player-side .hand-title {
      color: #8bbce8;
      text-shadow: 0 0 6px rgba(139, 188, 232, 0.4);
    }

    .banker-side .hand-title {
      color: #f1a3a3;
      text-shadow: 0 0 6px rgba(241, 163, 163, 0.4);
    }

    .score-badge {
      width: 26px;
      height: 26px;
      background-color: #121212;
      border: 1.5px solid #d4af37;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
    }

    /* Cards Flex Container */
    .cards-row {
      display: flex;
      gap: 12px; /* Fixed card crowding */
    }

    /* Individual Authentic Card Base Styling */
    .card {
      width: 64px;
      height: 90px;
      background: #ffffff;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
      position: relative;
      border: 1px solid #d0d0d0;
      user-select: none;
      overflow: hidden;
    }

    .card.red {
      color: #d32f2f;
    }

    .card.black {
      color: #1a1a1a;
    }

    /* Corner Rank & Suit Indices */
    .card-corner {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 0.9;
      font-weight: bold;
    }

    .card-corner.top-left {
      top: 4px;
      left: 4px;
    }

    .card-corner.bottom-right {
      bottom: 4px;
      right: 4px;
      transform: rotate(180deg);
    }

    .card-corner .rank {
      font-size: 14px;
    }

    .card-corner .suit-mini {
      font-size: 11px;
      margin-top: 1px;
    }

    /* Card Pips Layout (Standard 7 Layout) */
    .pips-7 {
      position: absolute;
      top: 16px;
      bottom: 16px;
      left: 18px;
      right: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(3, 1fr);
      font-size: 13px;
      align-items: center;
      justify-items: center;
    }

    .pip-center-top {
      position: absolute;
      top: 28%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 13px;
    }

    /* Jack & Queen Face Card Illustration Graphics */
    .face-illustration {
      position: absolute;
      top: 16px;
      bottom: 16px;
      left: 14px;
      right: 14px;
      border: 1px solid #c0c0c0;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 2px;
    }

    /* Double-headed Royalty Graphic Placeholder */
    .face-illustration svg {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="table-area">
      
      <div class="vip-badge">VIP</div>

      <div class="table-hands">
        
        <!-- PLAYER HAND (J♣, J♥) -->
        <div class="hand-side player-side">
          <div class="hand-header">
            <span class="hand-title">PLAYER</span>
            <div class="score-badge">0</div>
          </div>
          <div class="cards-row">
            
            <!-- J Clubs -->
            <div class="card black">
              <div class="card-corner top-left">
                <span class="rank">J</span>
                <span class="suit-mini">♣</span>
              </div>
              <div class="face-illustration">
                <!-- SVG Vector Face Card representation -->
                <svg viewBox="0 0 40 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect width="40" height="56" fill="#FFF8E7"/>
                  <path d="M5 5 H35 V27 H5 Z" fill="#D32F2F"/>
                  <path d="M5 29 H35 V51 H5 Z" fill="#1976D2"/>
                  <circle cx="20" cy="16" r="6" fill="#FBC02D"/>
                  <circle cx="20" cy="40" r="6" fill="#FBC02D"/>
                  <text x="20" y="20" font-size="10" text-anchor="middle" fill="#000">♣</text>
                  <text x="20" y="44" font-size="10" text-anchor="middle" fill="#000">♣</text>
                </svg>
              </div>
              <div class="card-corner bottom-right">
                <span class="rank">J</span>
                <span class="suit-mini">♣</span>
              </div>
            </div>

            <!-- J Hearts -->
            <div class="card red">
              <div class="card-corner top-left">
                <span class="rank">J</span>
                <span class="suit-mini">♥</span>
              </div>
              <div class="face-illustration">
                <svg viewBox="0 0 40 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect width="40" height="56" fill="#FFF8E7"/>
                  <path d="M5 5 H35 V27 H5 Z" fill="#1976D2"/>
                  <path d="M5 29 H35 V51 H5 Z" fill="#D32F2F"/>
                  <circle cx="20" cy="16" r="6" fill="#FBC02D"/>
                  <circle cx="20" cy="40" r="6" fill="#FBC02D"/>
                  <text x="20" y="20" font-size="10" text-anchor="middle" fill="#D32F2F">♥</text>
                  <text x="20" y="44" font-size="10" text-anchor="middle" fill="#D32F2F">♥</text>
                </svg>
              </div>
              <div class="card-corner bottom-right">
                <span class="rank">J</span>
                <span class="suit-mini">♥</span>
              </div>
            </div>

          </div>
        </div>

        <!-- BANKER HAND (7♦, Q♣) -->
        <div class="hand-side banker-side">
          <div class="hand-header">
            <span class="hand-title">BANKER</span>
            <div class="score-badge">7</div>
          </div>
          <div class="cards-row">
            
            <!-- 7 Diamonds (Exact Pip Arrangement) -->
            <div class="card red">
              <div class="card-corner top-left">
                <span class="rank">7</span>
                <span class="suit-mini">♦</span>
              </div>
              <div class="pip-center-top">♦</div>
              <div class="pips-7">
                <span>♦</span><span>♦</span>
                <span>♦</span><span>♦</span>
                <span style="transform: rotate(180deg);">♦</span><span style="transform: rotate(180deg);">♦</span>
              </div>
              <div class="card-corner bottom-right">
                <span class="rank">7</span>
                <span class="suit-mini">♦</span>
              </div>
            </div>

            <!-- Q Clubs -->
            <div class="card black">
              <div class="card-corner top-left">
                <span class="rank">Q</span>
                <span class="suit-mini">♣</span>
              </div>
              <div class="face-illustration">
                <svg viewBox="0 0 40 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect width="40" height="56" fill="#FFF8E7"/>
                  <path d="M5 5 H35 V27 H5 Z" fill="#388E3C"/>
                  <path d="M5 29 H35 V51 H5 Z" fill="#D32F2F"/>
                  <polygon points="20,10 26,22 14,22" fill="#FBC02D"/>
                  <polygon points="20,46 26,34 14,34" fill="#FBC02D"/>
                  <text x="20" y="20" font-size="9" text-anchor="middle" fill="#000">♣</text>
                  <text x="20" y="42" font-size="9" text-anchor="middle" fill="#000">♣</text>
                </svg>
              </div>
              <div class="card-corner bottom-right">
                <span class="rank">Q</span>
                <span class="suit-mini">♣</span>
              </div>
            </div>

          </div>
        </div>

      </div>

    </div>
  </div>

</body>
</html>
